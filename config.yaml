# ===== 게임 창 =====
# 창 제목의 일부 (대소문자 무시, 부분 일치). 런처/브라우저 창과 구분하기 위해 프로세스 이름도 확인.
window_title: "도깨비의세계"
process_name: "dokkaebi.exe"
focus_on_start: false       # Cua 창 캡처로 뒤에 있는 게임도 읽으므로 시작할 때 포커스를 빼앗지 않는다.

# 마우스 입력은 Cua 백그라운드 창 전달만 사용하며 물리 커서 우회는 금지한다.
cua_input:
  enabled: true
  capture_enabled: false   # 평상시 스크린샷은 mss 사용, 실제 입력할 때만 Cua 호출
  cursor_motion_ms: 1      # 클릭 위치로 즉시 이동(커서 이동 애니메이션 없음)
  session: "dokkaebi-helper"
  timeout: 12

# ===== 루프 =====
loop_interval: 0.5        # 전환·이동·입력 직후의 빠른 화면 확인 주기 (초)
stable_loop_interval: 2.0 # 안정적인 전투·대기 중 화면 확인 주기 (초)
match_threshold: 0.85     # 템플릿 매칭 기본 임계값 (0~1, 높을수록 엄격)

# ===== 사용자 조작 감지 =====
# 게임 안에서 사용자가 마우스/키보드를 조작하면 멈추고, 이 시간(초) 동안 조작이 없으면 다시 진행
user_idle_resume: 120

# ===== 멈춤 감지 =====
# 1순위: auto_indicator 템플릿이 있으면 "자동 진행 중" 표시가 보이는지로 판단
# 2순위: 없으면 idle_region 영역의 화면 변화량으로 판단
idle:
  auto_indicator: auto_running.png   # 하단 중앙 "자동 이동 중" 표시. 없으면 무시됨
  indicator_region: [0.35, 0.65, 0.3, 0.1] # [x, y, w, h] 화면 비율
  region: [0.3, 0.25, 0.4, 0.5]      # 변화량 감지 영역 (캐릭터 주변)
  diff_threshold: 2.5                # 평균 픽셀 차이가 이 값보다 크면 "움직이는 중"
  seconds: 6                         # 이 시간 이상 멈추면 퀘스트 클릭

# ===== 필드 화면 판별 =====
# 이 표시(우하단 설정 톱니바퀴)가 보일 때만 퀘스트를 클릭한다. 메뉴/컷신 중 오클릭 방지.
field_indicator:
  template: field_hud.png
  region: [0.75, 0.85, 0.15, 0.15]

# ===== 문파 도움 =====
# 왼쪽 아래 초록색 지도·악수 아이콘이 실제로 보일 때 눌러 문파원의 도움 요청에 응답한다.
clan_help:
  enabled: true
  template: clan_help.png
  region: [0.0, 0.68, 0.07, 0.20]
  threshold: 0.90
  cooldown: 30

# ===== 매일 21시 보스토벌 =====
# 20:55에 무료 걸어가기를 먼저 시작하고 21:00까지 미도착하면 축지술로 전환한다.
# 이 작업의 축지술은 금액 제한 없이 예외이며, 대상 보스명과 버튼을 확인했을 때 누른다.
boss_hunt:
  enabled: true
  mountain_tiger_enabled: true   # 월·수·금·일: 산신 산군대호
  skeleton_general_enabled: true # 화·목·토: 해골장군
  prepare_at: "20:55"
  starts_at: "21:00"
  duration_minutes: 5
  finish_absent_seconds: 10
  retry_seconds: 30
  travel_timeout_seconds: 420
  icon_template: boss_hunt_icon.png
  title_template: boss_hunt_title.png
  icon_threshold: 0.88

# ===== 매일 22시 낙화의 전장 요화선녀 =====
# 21:58부터 메뉴 → 낙화의 전장 → 입장 가능한 일반 채널 순서로 진입한다.
# 입장 뒤 낙화 전용 미니맵의 현재 안전 위치를 유지하고 프리셋 B(단일 저격)와 AUTO를 켠다.
nakhwa_boss:
  enabled: true
  prepare_at: "21:58"
  starts_at: "22:00"
  entry_window_minutes: 30
  retry_seconds: 15
  stay_at_current_position: false    # 입장 가장자리는 몬스터가 없으므로 전용 지도 사냥 지점으로 이동
  scoreboard_tab: [0.974, 0.114]    # 우측 낙화 전용 임무(?) 탭: 점수표를 항상 펼침
  map_open_target: [0.179, 0.129]     # 필드 좌상단 낙화 전용 미니맵 중앙
  direct_minimap_target: [0.208, 0.174]  # 첨부 화면의 우하단 통로 사냥 위치(약 400, 188)
  center_move_target: [0.504, 0.509]  # 첨부 지도 중앙 녹색 지점(약 968, 550)
  boss_move_target: [0.504, 0.509]    # 요화선녀도 같은 안전 사냥 지점 사용
  center_move_wait_seconds: 90
  hunt_preset: 2                      # 프리셋 B: 단일 저격 세팅
  auto_button: [0.887, 0.942]

# ===== 대시보드 기간 이벤트 =====
event_calendar:
  nakhwa_depth:
    title: "낙화의 전장 · 심처 개방"
    starts_at: "2026-10-17T23:00:00"
    ends_at: "2026-10-18T23:00:00"

# ===== 전투 판별 =====
# 상단 중앙 대상 몬스터 체력 바의 ⚔ 아이콘. 보이면 전투 중 → 퀘스트 클릭/영기 수련 보류
combat_indicator:
  templates: [combat_target.png, combat_boss.png]   # 일반 몬스터 / 보스
  region: [0.35, 0.04, 0.3, 0.06]

# ===== 오른쪽 퀘스트 목록 =====
quest_tracker:
  enabled: true                      # false면 퀘스트 클릭은 하지 않음 (영기 수련만 등)
  template: main_quest_icon.png      # 메인 퀘스트 노란 (!) 아이콘
  search_region: [0.78, 0.12, 0.2, 0.4]
  click_offset: [100, 0]             # 아이콘 오른쪽의 퀘스트 이름을 클릭 (픽셀)
  click: [0.865, 0.199]              # 아이콘을 못 찾으면 이 비율 좌표 클릭 (메인 퀘스트 제목)
  candidates:                        # v2: 메인 퀘스트 줄 후보 (비율 좌표). 트래커 스크롤 상태에 따라 y가 달라진다
    - [0.863, 0.139]                 # 스크롤된 목표 줄 ("...로 이동하기")
    - [0.865, 0.199]
    - [0.863, 0.241]
  cooldown: 8                        # 퀘스트 클릭 후 최소 대기 (초)
  max_retries: 4                     # 연속 클릭해도 진행 안 되면 일시정지 + 알림
  scan:
    enabled: true
    region: [0.78, 0.06, 0.2, 0.40]   # 트래커 영역 (비율)
    main_tab: [0.975, 0.113]            # 우측 세로 메뉴 첫 번째 ? 두루마리: 메인 퀘스트 목록
    main_tab_wait: 0.6
    max_pages: 8
    page_notches: 36                  # 한 페이지당 휠 칸 수 (1칸 ≈ 3px)
  nudge_minutes: 5                   # 퀘스트 목록 변화 없이 전투만 이만큼 계속되면 퀘스트를 다시 누른다 (0이면 끔)
  verify_seconds: 7                  # v2: 클릭 후 이 시간 안에 진행(이동/전투/목록 변화)이 없으면 실패로 센다

# ===== 영기 수련 자동 진행 =====
# interval마다 필드에서 ☰ → 영기 수련을 열어, 진행 중이 아니면 왼쪽부터 0/1 노드를 수련 시작
yeonggi:
  enabled: true
  interval: 180            # 확인 주기 (초)
  clan_help_interval: 300  # 진행 중 수련 바로가기 → '문파 도움' 확인 주기 (5분)
  clan_help_retry: 300     # 버튼이 없을 때 재확인 (5분)
  retry_delay: 30          # 화면 열기에 실패했을 때 다시 시도할 때까지 (초)
  max_tries: 6             # 한 번에 시도할 노드 수
  node_threshold: 0.8      # "0/1" 노드 인식 임계값 (노드 배경이 조금씩 달라 기본값보다 낮춤)
  templates:
    menu_button: menu_button.png       # 필드 우상단 ☰
    menu_entry: menu_yeonggi.png       # 메뉴 안 '영기 수련'
    title: yg_title.png                # 영기 수련 화면 제목
    back: yg_back.png                  # 왼쪽 위 뒤로가기
    progress: yg_progress.png          # 하단 모래시계 (진행 중 표시)
    node_empty: yg_node_empty.png      # (미사용) 노드의 "0/1"
    node_ready: yg_node_ready.png      # 노드 우상단 빨간 점 = 수련 가능한 노드
    train: yg_train.png                # 팝업 '수련' 버튼
    impossible: yg_impossible.png      # "현재 수련이 불가능합니다."
    close: yg_close.png                # 팝업 X
    current_go: yg_current_go.png      # 하단 진행 중 수련 카드의 '바로가기'
    clan_help: yg_clan_help.png        # 영기 수련 하단 '문파 도움'
  regions:                             # [x, y, w, h] 화면 비율 (생략하면 전체 검색)
    menu_button: [0.9, 0.0, 0.1, 0.1]
    title: [0.0, 0.0, 0.2, 0.08]
    back: [0.0, 0.0, 0.06, 0.08]
    progress: [0.3, 0.85, 0.2, 0.15]
    node_empty: [0.0, 0.2, 1.0, 0.55]
    node_ready: [0.0, 0.2, 1.0, 0.65]    # 위쪽 아이콘/내기 수련 버튼의 빨간 점은 제외
    close: [0.3, 0.05, 0.5, 0.4]
    current_go: [0.52, 0.86, 0.16, 0.12]
    clan_help: [0.28, 0.68, 0.20, 0.16]

# ===== 팝업 처리 (위에서부터 우선순위) =====
# action: click(템플릿 위치 클릭, 기본값) | key(키 입력)
popups:
  - name: 대화 넘기기
    template: dialog_skip.png          # 대화 우상단 "넘기기 ESC" 버튼
    region: [0.9, 0.0, 0.1, 0.15]
  - name: 대화 다음
    template: dialog_next.png
  - name: 퀘스트 완료/보상
    template: reward.png
  - name: 퀘스트 수락
    template: accept.png
  - name: 컷신 스킵
    template: cutscene_skip.png
    action: key
    key: esc
  - name: 부활
    template: revive.png
    after_delay: 3

popup_after_delay: 1.0     # 팝업 처리 후 기본 대기 (초)

# ===== 단축키 =====
hotkeys:
  stop: F12      # 매크로 종료
  pause: F11     # 일시정지 / 재개

# ===== v2 (run.py) 전용 =====
death:
  template: death_title.png          # "사망 상태" 제목
  region: [0.4, 0.0, 0.25, 0.1]
  free_buttons: [death_leave.png, death_base_revive.png]   # 나가기 / 거점 이동 후 부활. 유료 '즉시 부활'은 템플릿에 넣지 않는다
  button_region: [0.3, 0.9, 0.45, 0.1]
  button_threshold: 0.8
  button_wait: 45        # 사망 직후 화면이 서서히 나타나 버튼이 늦게 뜬다 → 이 시간(초)까지는 포기하지 않고 계속 기다림
  streak_limit: 5        # streak_window초 안에 이만큼 죽으면 일시정지
  streak_window: 600
  policy: retry          # retry = 거점 부활 후 같은 퀘스트 재도전, switch = 바로 다른 퀘스트로
  retry_limit: 1         # 같은 퀘스트 재도전 횟수
  after_retry: farm      # 재도전도 실패하면: farm = 전투력에 맞는 사냥터에서 block_seconds 동안 자동 사냥 후 퀘스트 복귀, switch = 다른 퀘스트
  retry_delay: 6         # 부활 후 재도전까지 기다리는 시간(초)
  block_seconds: 1800    # 사망한 퀘스트(임무 탭)를 이 시간 동안 중단하고 다른 퀘스트를 진행
  max_block_seconds: 14400   # 같은 퀘스트에서 반복 사망하면 중단 시간을 2배씩 늘리되 이 값까지
  repeat_window: 10800       # 이 시간(초) 안의 사망만 '반복'으로 센다
  gate_deaths: 4             # 전투력 게이트: 한 퀘스트에서 이만큼 죽으면
  gate_gain: 0.03            #   전투력이 그때보다 3% 이상 오를 때까지 그 퀘스트를 재도전하지 않음
  retry: 3.0
overlay:
  grace: 8.0         # 필드가 아닌 화면을 이만큼 기다린 뒤
  max_esc: 3         # ESC를 최대 이 횟수만큼 눌러 보고, 그래도 안 되면 일시정지
  esc_gap: 4.0
autohunt:
  region: [0.875, 0.9194, 0.01875, 0.0222]   # 하단 T 슬롯 'AUTO' 글자(x 1680~1716, y 993~1017). 주황색이면 켜짐, 회색이면 꺼짐. 2026-10-14 HUD 위치가 바뀐 것을 실측해 수정 (예전 0.851은 버튼 왼쪽 빈 곳이라 항상 꺼짐으로 읽혔다)
  on_percent: 5.0
  after_move: true       # 자동 이동이 끝나면 자동 사냥(T)을 켠다
  min_move: 3.0          # 이만큼(초) 이상 이동한 뒤에만 '이동 종료'로 본다
  end_delay: 1.5         # 이동 표시가 이만큼(초) 사라져 있어야 종료로 본다 (깜빡임 방지)

# ===== 임무 화면(J) 자동 진행 =====
mission:
  enabled: true
  priority: ["일일", "본편", "서사", "주간"]  # 일일 퀘스트를 가장 먼저 진행
  start_priority: true       # 시작/재개 직후 우선 탭을 즉시 확인
  daily_ok_index: 1          # 수락 임무가 없을 때 명상(첫 적합)을 건너뛰고 다음 적합 전투 일일 선택
  daily_guide_fallback: true # 자동 진행 이동이 없으면 퀘스트 지역의 가장 안전한 길라잡이 사냥터로 무료 이동
  after_fails: 2          # 트래커 클릭이 이만큼 연속 실패하면 임무 화면을 연다
  cooldown: 90            # 임무 화면 확인 최소 간격(초)
  skip_seconds: 600       # 진행 못 한 탭을 건너뛰는 시간
  badge_threshold: 0.85
  story_badge_threshold: 0.65  # 실제 게임 화면의 초록 '적합' 배지 허용치
  story_retry_seconds: 15      # 순간 인식 실패 시 빠르게 재확인
  templates:
    title: ms_title.png        # 임무 화면 제목
    auto: ms_auto.png          # '자동 진행'
    accept: ms_accept.png      # 일일 '수락'
    ok_badge: ms_ok.png        # 초록 '적합' 배지 ('위험'은 템플릿이 없어 선택/수락되지 않는다)
  regions:
    title: [0.0, 0.0, 0.15, 0.08]
    auto: [0.6, 0.9, 0.4, 0.1]
    accept: [0.6, 0.9, 0.4, 0.1]
    list: [0.1, 0.18, 0.8, 0.75]

# ===== v2: NPC 대화 스킵 =====
dialog:
  method: key      # '넘기기 ESC'가 실제로 보일 때만 ESC. '대화 다음'은 버튼 클릭
  key: esc
  gap: 0.6         # 연속 스킵 최소 간격(초). 대화가 끝난 직후 ESC가 필드에서 메뉴를 여는 것을 막는다

# ===== 트래커 스캔(OCR): 첫 클릭이 막히면 목록을 스크롤하며 읽어 다른 퀘스트를 고른다 =====

# ===== 퀘스트 수락 화면(세계지도 '진행 가능한 임무') =====
map_accept:
  title: map_title.png            # 세계지도 제목
  title_region: [0.03, 0.0, 0.2, 0.08]
  button: map_accept.png          # 우하단 '수락'
  go_button: ms_auto.png          # 수락 뒤 같은 자리에 생기는 '자동 진행' (옆의 '포기'는 누르지 않음)
  button_region: [0.75, 0.9, 0.25, 0.1]
  gap: 3.0

# ===== 사냥터 고정(앵벌) 모드 =====
# 켜면 퀘스트(본편/임무)는 건드리지 않고, 내 전투력에 맞는 사냥터(farm_spots.json)로 걸어가 자동 사냥(T)만 유지한다.
# DB는 python -m tools.farm_scan "지역이름" 배너x 배너y 로 만든다 (세계지도 몬스터 전투력을 읽음).
farm:
  enabled: false            # true면 퀘스트 없이 사냥터만 (앵벌 전용)
  fallback_when_blocked: true   # 퀘스트 모드에서 사망으로 모든 퀘스트가 막히면 안전 사냥터에서 사냥
  travel: guide            # guide = 길라잡이(F5) 추천 사냥터 무료 순간이동, map = 세계지도 걸어가기(farm_spots.json)
  claim_minutes: 30        # 길라잡이 사냥터 미션 보상(권장 전투력 달성) 확인 주기
  spots_file: farm_spots.json
  margin: 1.5               # 몬스터 전투력이 (내 전투력 x margin) 이하인 사냥터 중 가장 센 곳을 고른다 (2026-10-14 사용자 지시: 1.5배까지 충분히 잡을 수 있음. 사망하면 그 단계 이상은 자동 제외)
  reselect_minutes: 15      # 이 주기로 전투력을 다시 읽어 사냥터를 올리거나 내린다
  upgrade_gain: 1.15        # 더 센 사냥터가 지금보다 이 배수 이상일 때만 올라간다 (잦은 이동 방지)
  death_ban_minutes: 60     # 사망한 사냥터를 제외하는 시간

# ===== 일반 모드 =====
# 퀘스트·사냥터 재선택 없이 현재 위치에서 자동 사냥한다. 저체력 때는 실제 지도 도로를 따라
# 일정 거리 이상 피신하고 HP 100% 회복 후 지도 지형을 정합해 원래 위치로 돌아온다.
normal_mode:
  enabled: true

# ===== 망자의 마을 3단계 전투 =====
# 캐릭터 HP가 충분할 때는 광역, 낮아지면 단일 저격으로 바꿔 물약 소모를 줄인다.
# 일일 전용으로 입장한 경우 지정 시간을 채운 뒤 나가 다음 일일을 진행한다.
secret_realm_combat:
  enabled: true
  aoe_preset: 4                 # 기본 D 광역 · A=1, B=2, C=3, D=4, E=5
  single_preset: 2              # 기본 B 저격
  single_below_hp_percent: 65     # 게임 물약 60% 발동 전에 먼저 단일 전환
  aoe_resume_hp_percent: 90
  switch_cooldown_seconds: 15
  daily_duration_minutes: 60

# ===== 일일 임무 전용 모드 =====
# 본편·서사·주간은 진행하지 않는다. 메인 미션 목록을 끝까지 두 번 확인해 [일일]이
# 모두 사라지면 완료로 판정하고 앵벌 모드로 전환한다.
daily_mode:
  enabled: false
  absence_confirm_seconds: 8
  active_absence_confirm_seconds: 180  # 진행 시작한 일일이 트래커에서 숨으면 충분히 사냥한 뒤 임무 탭 재확인
  tracker_monitor_seconds: 5  # 일일 모드에서 메인 퀘스트 목록을 끝까지 내려 재확인하는 주기

# ===== 서사 임무 전용 모드 =====
# 서사 탭에서 게임이 현재 전투력에 맞다고 표시한 '적합' 임무만 수락·자동 진행한다.
story_mode:
  enabled: false

# ===== 멈춤 감시 =====
# 이 시간 동안 이동/전투/대화가 전혀 없으면 화면을 저장하고 단계별로 복구 (3번 연속 실패하면 일시정지)
stall:
  minutes: 10

# 다른 창에서 한 키보드/마우스 조작은 게임 조작으로 치지 않는다 (게임 창이 맨 앞일 때의 조작만 양보)
user_detect: true          # 사용자 조작 감지 (제어판 상단 토글 버튼으로 켜고 끔; 끄면 마우스·키보드를 써도 봇이 양보하지 않음)
startup_check: true         # 시작하면 먼저 화면을 찍어 지도·HP·전투력·물약·퀘스트 수를 읽고 로그에 남김
yield_only_game_input: true

# ===== 폰 알림 / 원격 제어 =====
# 텔레그램: @BotFather 로 봇을 만들어 token, 봇에게 말을 건 뒤 https://api.telegram.org/bot<token>/getUpdates 에서 chat id 확인
# 디스코드: 채널 설정 → 연동 → 웹후크 URL
notify:
  enabled: false
  telegram:
    token: ""
    chat_id: ""
  discord:
    webhook: ""
  min_gap: 20          # 같은 종류 알림 최소 간격(초)
  report_hour: 9       # 매일 이 시각(0~23)에 일일 리포트. 끄려면 null

# ===== 체력 관리 =====
# 하단 체력 바를 읽어 낮으면 물약 단축키를 누른다. 물약은 하단 Ctrl+1 칸에만 있다 (Ctrl+2는 없음).
hp:
  enabled: true
  potion_keys: ["ctrl+1"]      # 물약이 있는 칸은 Ctrl+1 하나뿐
  potion_normal: false    # false = 평소 사냥 중 물약은 게임 자체 자동 물약에 맡김 (헬퍼는 휴식·자리 회피 중 회복할 때만 누름). true = 평소에도 헬퍼가 누름
  potion_below: 0.45      # potion_normal이 true일 때: HP가 이 비율 아래면 물약
  potion_gap: 6.0         # 물약 최소 간격(초)
  danger_below: 0.2       # 이 아래면 위험 알림
  rest_enabled: true      # 보스가 아닌데 HP가 낮으면 잡던 몹까지만 잡고 자동 사냥을 끄고 회복
  evade_guide_first: false # 위험 시 현재 세계지도의 도로 픽셀을 분석해 먼 길로 걸어서 피신
  startup_risk_check: true # 시작·재개 시 몬스터 전투력 두 프레임 확인
  rest_below: 0.50        # 이 비율 이하면 휴식 시작 (보스가 아닐 때: 잡던 몹까지만 잡고 자동 사냥 끔)
  rest_resume: 0.80       # 일반 휴식 복귀 기준
  evade_resume: 1.00      # 자리 회피는 HP 100% 회복 후 원래 위치로 복귀
  rest_finish_max: 300    # 잡던 몹은 죽을 때까지 기다린다(사용자 지시). 이 시간(초)은 몹이 아예 안 죽는 비정상 상태 방지용
  rest_max: 600           # 이 시간(초)이 지나도 안 차면 그냥 다시 켜기 (물약 쿨타임·자연 회복이 느릴 때 무한 대기 방지)
  rest_fight_below: 0.15  # 쉬는 중 공격받아 HP가 이 아래로 떨어지면 다시 싸움
  evade_enabled: true     # 자리 회피: 자동 사냥 중 HP가 evade_below 이하면 세계지도로 몹이 적은 쪽(걸어가기, 무료)으로 빠졌다가 회복 후 같은 거리만큼 돌아와 다시 사냥
  evade_below: 0.20
  evade_dist_px: 900      # 지도 중앙 배율에서 탐색할 최대 거리(1920×1080 기준 픽셀)
  evade_min_dist_px: 560  # 중앙 배율 40m 후보를 찾기 위한 최소 픽셀 거리
  evade_min_meters: 40    # 걸어가기 버튼 위 실제 표시 거리가 이 값 이상일 때만 이동
  evade_cooldown: 60      # 회피 후 이 시간(초) 안에는 다시 회피하지 않음 (그때는 일반 휴식)

# ===== 화첩 / 유물 수집 =====
# 앵벌 시간(사망 후·퀘스트 막힘·사냥터 모드)에 일반 사냥터 대신, 아직 못 모은 화첩 조각/유물을 떨어뜨리는 몬스터에게
# 무료 자동 이동(발자국)으로 가서 자동 사냥. 획득처에 '요귀'가 없는 것(퀘스트 전용)은 건너뛴다. 약한 몬스터부터.
collect:
  enabled: false          # 화첩 조각 모으기는 사용자가 직접 한다 → 수집 사냥·등록·스캔·완료 체크 전부 끔 (2026-10-14 사용자 지시). 다시 쓰려면 true
  max_ratio: 2.0          # 몬스터 전투력이 내 전투력의 이 배수 이하인 것까지 (빨간 이름은 확실히 읽힌 값만)
  album: true             # 화첩
  relics: false           # 유물 수집: 스캔/등록 모두 끔 (유물 등록은 아이템이 인벤토리에서 사라지는 확인 창이 떠서 자동화하지 않음)
  scan_hours: 24          # 이 시간마다 화첩/유물 목록을 다시 스캔 (앵벌 시작 때, 십여 분)
  relic_max_items: 150
  register_minutes: 60    # 모은 조각/유물 등록(화첩 표지 빨간 점 → 모두 등록) 주기
  first_register_delay: 300
  death_ban_minutes: 60   # 수집 몬스터에서 죽으면 그 몬스터를 이 시간 제외
  db_file: collect_db.json
  min_hunt_minutes: 3     # 한 수집 몬스터에서 최소 이만큼은 사냥
  max_hunt_minutes: 25    # 한 수집 몬스터에서 이만큼 사냥하면 다음 후보로 (완성된 그림은 후보에서 빠짐)
  use_item_dict: true     # 다음에 잡을 몬스터를 아이템 사전 조사(item_dict.json)와 완료 기록(collect_done.json)으로 정한다 (그림 안에 들어가 고르지 않음). false면 예전 방식(collect_db.json)
  detect_piece_in_chat: false   # 채팅에서 '화첩 조각 획득'을 읽어 바로 교대 (채팅 글씨를 거의 못 읽어서 꺼 둠, 실험용)

# ===== 공짜 보상 자동 받기 =====
# 우편함 '모두 받기'(4개 탭), 업적 '모두 받기'(5개 탭), 길라잡이 사냥터 미션 '보상 받기'. 받기 버튼만 누른다.
rewards:
  enabled: false            # 주기 보상 받기 전체 끔 (우편함·업적·길라잡이 모두 제외, 사용자 지시)
  interval_minutes: 60
  first_delay: 120        # 시작 후 처음 받기까지 (초)
  mail: false            # 우편함은 주기적으로 안 받음 (사용자 지시)
  achievements: false    # 업적 완료 체크는 주기적으로 안 함 (사용자 지시, 새 도술 습득 감지도 같이 꺼짐)
  guide: false           # 길라잡이 보상 받기도 안 함 (사용자 지시)

# ===== 도술 프리셋 =====
# 사용자 지정 프리셋을 앱이 임의로 변경하지 않는다.
preset:
  enabled: false
  normal: 1               # 도술 프리셋 번호 (1 일반)
  boss: 2                 # (2 보스)
  boss_seconds: 3         # 보스가 이만큼 보이면 전환
  normal_seconds: 60      # 보스가 이만큼 안 보이면 일반으로

# ===== 도술 계열 강화 (선택, 기본 꺼짐) =====
# 성장(U) → 도술 → 계열 선택 → 자동 등록 → 재료가 충분할 때만 강화 (골드 소모). 강화 뒤 화면은 미검증.
enhance:
  enabled: false
  styles: ["파멸", "저격"]   # 주력 계열 (일반 프리셋=파멸, 보스 프리셋=저격)
  interval_minutes: 180

# ===== HP 물약 자동 구매 =====
# 하단 물약 칸(Ctrl+1) 개수가 buy_below 이하면 타바로 성 잡화 상점(복분이)으로 걸어가서 물약 200개만 산다.
# 세계지도 '위치'에 저장한 '타바로 성(112,104)'(복분이 앞)을 쓴다. 축지술(유료)은 쓰지 않는다.
potion_shop:
  enabled: true
  buy_below: 50
  purchase_amount: 200    # 전체 구매 금지: 한 번에 정확히 이 수량만 구매
  stack_limit: 250        # 게임 물약 소지 한도(수량 창 최대값 계산용)
  auto_per_day: 1         # 자동 구매는 하루 이만큼만 (제어판 '물약 구매' 버튼은 제한 없음)
  item: 2단               # 2단 체력 회복 물약 (1,200골드) / 1단 (450골드)
  check_minutes: 5
  walk_timeout: 600       # 상점까지 걸어가는 최대 시간(초)
